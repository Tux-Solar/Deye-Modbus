# reference
# https://www.home-assistant.io/integrations/sensor.mqtt/
# device classes: https://www.home-assistant.io/integrations/sensor/#device-class
# State template: https://forum.hacf.fr/t/unites-de-mesure/64577/8

# Deye-2 Inverter
# ----------------  
- unique_id: deye2_radiator_temp
  name: DEYE2 Radiator Temp
  device:
    identifiers: Inverter-2
    name: Inverter-2
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: measurement 
  unit_of_measurement: "°C"
  device_class: temperature
  state_topic: deye2/Radiator-Temperature
  value_template: "{{ ( value_json.data - 1000 ) | float / 10 }}"
  enabled_by_default: true
  
- unique_id: deye2_load_consumption
  name: DEYE2 Load Consumption
  device:
    identifiers: Inverter-2
    name: Inverter-2
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: total_increasing
  device_class: energy
  unit_of_measurement: kWh
  state_topic: deye2/Energy-Total-Consumption
  value_template:  "{{ value_json.data | float / 10 }}"
  enabled_by_default: true

- unique_id: deye2_total_production
  name: DEYE2 Total Production
  device:
    identifiers: Inverter-2
    name: Inverter-2
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: total_increasing
  unit_of_measurement: kWh
  device_class: energy
  state_topic: deye2/Energy-Total-Production
  value_template:  "{{ value_json.data | float / 10 }}"
  enabled_by_default: true

- unique_id: deyer2_daily_production
  name: DEYE2 Daily Production
  device:
    identifiers: Inverter-2
    name: Inverter-2
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: total
  unit_of_measurement: kWh
  device_class: energy
  state_topic: deye2/Energy-Daily-Production
  value_template:  "{{ value_json.data | float / 10 }}"
  enabled_by_default: true

