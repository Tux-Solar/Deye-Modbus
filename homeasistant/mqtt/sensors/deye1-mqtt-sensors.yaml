# reference
# https://www.home-assistant.io/integrations/sensor.mqtt/
# device classes: https://www.home-assistant.io/integrations/sensor/#device-class
# State template: https://forum.hacf.fr/t/unites-de-mesure/64577/8

# Deye-1 Inverter
# ----------------  
- unique_id: deye1_radiator_temp
  name: DEYE1 Radiator Temp
  device:
    identifiers: Inverter-1
    name: Inverter-1
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: measurement 
  unit_of_measurement: "°C"
  device_class: temperature
  state_topic: deye1/Radiator-Temperature
  value_template: "{{ ( value_json.data - 1000 ) | float / 10 }}"
  enabled_by_default: true

- unique_id: deye1_battery_total_discharge
  name: DEYE1 Battery Total Discharge
  device:
    identifiers: Inverter-1
    name: Inverter-1
    model: Deye 6.5KVA
    model_id: deye-inverter
  state_class: total_increasing
  unit_of_measurement: kWh
  device_class: energy
  state_topic: deye1/Battery-Total-Discharge
  value_template: "{{ value_json.data | float / 10 }}"
  enabled_by_default: true

- unique_id: deye1_battery_total_charge
