# ref: https://forum.hacf.fr/t/creation-dun-capteur-virtuel/38359/2
- name: Inverter2 Instant Power
  unique_id: inverter2-instant_power
  state_class: measurement
  unit_of_measurement: W
  device_class: power
  state: "{{ (states('sensor.inverter_2_deye2_mptt1_power') | int(0)) + (states('sensor.inverter_2_deye2_mptt2_power') | int(0)) }}"

